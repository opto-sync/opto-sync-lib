[package]
name = "opto-sync-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Runtime-neutral optimism, retry, checkpoint, and lifecycle policies for Opto Sync"
repository = "https://github.com/opto-sync/opto-sync-lib"

[dependencies]
opto-sync-interfaces = { git = "https://github.com/opto-sync/opto-sync-interfaces.git", rev = "b92b3a2eb43eeb183144521a188ae465a013951e" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
